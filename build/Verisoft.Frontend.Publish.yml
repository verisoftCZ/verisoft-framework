pool:
  vmImage: ubuntu-latest
  name: "VerisoftHosted"

variables:
  applicationPath: "src/Verisoft.Frontend"
  nodeVersion: "20.x"

trigger: none
pr: none

parameters:
  - name: releaseType
    displayName: "Release type (patch / minor / major)"
    type: string
    default: "patch"
    values:
      - patch
      - minor
      - major

jobs:
  - job: Publish
    displayName: "Build and Publish Verisoft packages"
    timeoutInMinutes: 20

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: NodeTool@0
        inputs:
          versionSpec: "$(nodeVersion)"
          registryUrl: "https://registry.npmjs.org/"
        displayName: "Setup Node.js"

      - script: |
          npm ci --include=optional
        displayName: "Install dependencies"
        workingDirectory: $(applicationPath)

      # Overi NPM token pred buildem; neplatny token vraci pri publish matouci 404.
      - script: |
          if [ -z "$NODE_AUTH_TOKEN" ] || [ "$NODE_AUTH_TOKEN" = '$(NPM_ACCESS_TOKEN)' ]; then
            echo "##[error]Secret variable NPM_ACCESS_TOKEN is not set on this pipeline."
            exit 1
          fi
          npm whoami
        displayName: "Verify npm authentication"
        workingDirectory: $(applicationPath)
        env:
          NODE_AUTH_TOKEN: $(NPM_ACCESS_TOKEN)

      - script: |
          echo "Bumping version: ${{ parameters.releaseType }}"
          npx nx release version --specifier ${{ parameters.releaseType }}
        displayName: "Bump version"
        workingDirectory: $(applicationPath)

      - script: |
          npx nx run-many --target=build --all --skip-nx-cache
        displayName: "Build all packages"
        workingDirectory: $(applicationPath)

      - script: |
          npx nx release publish --access public
        displayName: "Publish packages to NPM"
        workingDirectory: $(applicationPath)
        env:
          NODE_AUTH_TOKEN: $(NPM_ACCESS_TOKEN)

      - script: |
          VERSION=$(node -p "require('./src/libs/core/package.json').version")
          echo "##vso[task.setvariable variable=npmVersion]$VERSION"
        displayName: "Read published version"
        workingDirectory: $(applicationPath)

      # Pouziva identitu Azure Pipelines GitHub App z checkoutu (persistCredentials), zadny PAT.
      - script: |
          git -c user.name="Azure Pipelines" -c user.email="azure-pipelines@verisoft.cz" \
            tag -a "npm-v$(npmVersion)" "$(Build.SourceVersion)" -m "NPM packages v$(npmVersion)"
          git push origin "npm-v$(npmVersion)"
        displayName: "Tag version on GitHub"
