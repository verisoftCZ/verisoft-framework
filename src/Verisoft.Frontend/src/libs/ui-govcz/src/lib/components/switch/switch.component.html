<gov-form-control>
  <gov-form-switch
    [formControl]="formControl"
    [size]="size | govSize"
    [required]="required"
    [name]="name"
    [invalid]="ngControl?.errors"
  >
    @if (label && !noLabel) {
    <gov-form-label [size]="size" slot="label">
      {{ label }}
    </gov-form-label>
    }
  </gov-form-switch>
  <v-validation-message [ngControl]="ngControl"></v-validation-message>
</gov-form-control>
