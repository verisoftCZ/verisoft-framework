<gov-form-control class="mt-3">
    <gov-form-checkbox 
        [formControl]="formControl"
        [size]="size | govSize"
        [value]="value"
        [required]="required"
        [attr.disabled]="disabled ? 'true' : 'false'"
        [identifier]="id"
        [indeterminate]="indeterminate()"
        [name]="name"
        [invalid]="ngControl?.errors"
        [noLabel]="noLabel"
        [disabled]="disabled"
    >   
        <gov-form-label
            [size]="size"
            slot="label"
        >
            {{ label ?? '' | translate }}
        </gov-form-label>
    </gov-form-checkbox>
    <v-validation-message [ngControl]="ngControl"></v-validation-message>
</gov-form-control>
