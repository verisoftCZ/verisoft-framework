<gov-form-control>
    @if (label) {
    <gov-form-label 
        [slot]="labelSlot"
        [size]="size | govSize"
    >
        {{ label }}
    </gov-form-label>
    }
    <gov-form-group>
        <gov-form-input 
            [attr.input-type]="type"
            [formControl]="formControl"
            (gov-blur)="onGovBlur()"
            [minlength]="minlength" 
            [maxlength]="maxlength" 
            [size]='size | govSize'  
            [name]='name' 
            [role]='role'
            [required]="required"
            [readonly]="readonly"
            [invalid]="ngControl?.errors ? true : false"
            [attr.step]="computeStep()"
        >
            @if (icon) {
            <gov-icon
                [name]="icon"
                [slot]="iconPos === 'left' ? 'icon-start' : 'icon-end'"
            />
            } @if (clearable && formControl.value && formControl.enabled) {
            <gov-icon
                [name]="icons.cross"
                slot="icon-end"
                style="cursor: pointer"
                (click)="formControl.reset()"
            />
            } @if (prefix) {
            <p slot="prefix">
                {{ prefix }}
            </p>
            } @if (sufix) {
            <p slot="sufix">
                {{ sufix }}
            </p>
            }
        </gov-form-input>
        <v-validation-message [ngControl]="ngControl"></v-validation-message>
        @if (message) {
        <gov-form-message 
            [slot]="messageSlot" 
            color="neutral"
            >
            {{ message }}
        </gov-form-message>
        }
    </gov-form-group>
</gov-form-control>
