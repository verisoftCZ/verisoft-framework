<gov-form-control class="mb-3">
    @if (label) {
    <gov-form-label [slot]="labelSlot" [size]="size | govSize">
        {{ label | translate}}
    </gov-form-label>
    }
    <gov-form-group>
        <gov-form-input
            vDateInputFilter
            [formControl]="formControl"
            [attr.input-type]="type"
            [invalid]="ngControl?.errors ? true : false"
            [size]="size | govSize"
            [required]="required"
            [readonly]="readonly"
            [attr.disabled]="readonly ? 'true' : 'false'"
            [name]="name"
        />
    </gov-form-group>
    <v-validation-message [ngControl]="ngControl"></v-validation-message>
    @if (message) {
    <gov-form-message 
        [slot]="messageSlot" 
        color="neutral"
        >
        {{ message }}
    </gov-form-message>
    }
</gov-form-control>
