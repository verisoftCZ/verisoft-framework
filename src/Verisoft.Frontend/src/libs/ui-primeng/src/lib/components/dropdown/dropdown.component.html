<div class="v-dropdown">
  @if (label && !floatLabel) {
    <v-form-field
      [label]="label"
      [tooltip]="tooltip"
      [required]="isRequired()"
      [testId]="testId"
      [display]="formDisplay"
      >
      <p-select
        class="w-100"
        appendTo="body"
        [formControl]="formControl"
        [filter]="filter"
        [title]="label"
        [options]="options"
        [optionLabel]="optionLabel"
        [optionValue]="optionValue"
        [loading]="loading"
        [placeholder]="placeholder ?? ''"
        [virtualScroll]="lazy"
        [virtualScrollItemSize]="virtualOptionSize"
        [virtualScrollOptions]="virtualScrollOptions"
        [tooltip]="tooltip"
        [required]="isRequired()"
        [showClear]="formControl && clearable && !readonly"
        [editable]="editable"
        [dataKey]="optionValue"
        (showEvent)="onDropdownShow()"
        (clearEvent)="onDropdownClear()"
        (onFilter)="filterChange($event)"
        >
      </p-select>
    </v-form-field>
    <v-validation-message [ngControl]="ngControl"></v-validation-message>
  }
  @if (!label && !floatLabel) {
    <p-select
      class="w-100"
      appendTo="body"
      [formControl]="formControl"
      [filter]="filter"
      [title]="label"
      [options]="options"
      [optionLabel]="optionLabel"
      [optionValue]="optionValue"
      [loading]="loading"
      [placeholder]="placeholder ? placeholder : label"
      [tooltip]="tooltip"
      [required]="isRequired()"
      [showClear]="formControl && clearable && !readonly"
      [editable]="editable"
      [dataKey]="optionValue"
      [virtualScroll]="lazy"
      [virtualScrollItemSize]="virtualOptionSize"
      [virtualScrollOptions]="virtualScrollOptions"
      (showEvent)="onDropdownShow()"
      (clearEvent)="onDropdownClear()"
      (onFilter)="filterChange($event)"
      >
    </p-select>
  }
  @if (floatLabel && !label) {
    <p-floatLabel>
      <p-select
        class="w-100"
        appendTo="body"
        [formControl]="formControl"
        [title]="label"
        [options]="options"
        [optionLabel]="optionLabel"
        [optionValue]="optionValue"
        [loading]="loading"
        [placeholder]="placeholder ? placeholder : label"
        [filter]="filter"
        [tooltip]="tooltip"
        [required]="isRequired()"
        [showClear]="formControl && clearable && !readonly"
        [editable]="editable"
        [dataKey]="optionValue"
        [virtualScroll]="lazy"
        [virtualScrollItemSize]="virtualOptionSize"
        [virtualScrollOptions]="virtualScrollOptions"
        (showEvent)="onDropdownShow()"
        (clearEvent)="onDropdownClear()"
        (onFilter)="filterChange($event)"
        (lazyLoad)="onLazyLoad($any($event))"
        >
      </p-select>
      <label [for]="inputId">{{ floatLabel }}</label>
    </p-floatLabel>
  }
</div>
