<div class="v-text-field">
  @if (!floatLabel && label) {
    <v-form-field
      class="w-100"
      [label]="label"
      [tooltip]="tooltip"
      [required]="isRequired()"
      [testId]="testId"
      [display]="formDisplay"
      >
      <span
        class="w-100 flex-grow-1"
        [ngClass]="{ 'p-input-icon-right': type === 'search' || clearable }"
        >
        <input
          pInputText
          [id]="inputId"
          [formControl]="formControl"
          [type]="type === 'search' ? 'text' : type"
          class="w-100 flex-grow-1 v-text-field"
          [required]="isRequired()"
          [readOnly]="readonly"
          [title]="label"
          [placeholder]="placeholder ? placeholder : ''"
          [ngClass]="{
            'p-inputtext-sm': size === 'small',
            'p-inputtext-lg': size === 'large'
          }"
          />
        @if (type === 'search') {
          <i
            class="pi ms-2 v-text-field__icon"
            [ngStyle]="{
              cursor: ngControl && ngControl.value ? 'pointer' : 'default'
            }"
            [ngClass]="{
              'pi-search': ngControl && !ngControl.value,
              'pi-times': ngControl && ngControl.value,
            }"
            (click)="ngControl && ngControl.value ? ngControl.reset() : null"
          ></i>
        }
        @if (clearable && type !== 'search' && formControl.value) {
          <i
            class="pi pi-times ms-2 v-text-field__icon"
            style="cursor: pointer"
            (click)="formControl.reset()"
          ></i>
        }
      </span>
    </v-form-field>
    <v-validation-message [ngControl]="ngControl"></v-validation-message>
  } @else {
    <span
      class="w-100 flex-grow-1 d-flex align-items-center"
      [ngClass]="{ 'p-input-icon-right': type === 'search' || clearable }"
      >
      <p-floatLabel class="flex-grow-1">
        <input
          pInputText
          type="text"
          [id]="inputId"
          class="w-100 flex-grow-1"
          [required]="isRequired()"
          [formControl]="formControl"
          [placeholder]="placeholder ? placeholder : ''"
          [ngClass]="{
            'p-inputtext-sm': size === 'small',
            'p-inputtext-lg': size === 'large'
          }"
          />
        <label [for]="inputId" class="v-text-field__label">{{ label }}</label>
      </p-floatLabel>
      @if (type === 'search') {
        <i
          class="pi ms-2 v-text-field__icon"
          [ngStyle]="{
            cursor: ngControl && ngControl.value ? 'pointer' : 'default'
          }"
          [ngClass]="{
            'pi-search': ngControl && !ngControl.value,
            'pi-times': ngControl && ngControl.value,
          }"
          (click)="ngControl && ngControl.value ? ngControl.reset() : null"
        ></i>
      }
      @if (clearable && type !== 'search' && formControl.value) {
        <i
          class="pi pi-times ms-2 v-text-field__icon"
          style="cursor: pointer"
          (click)="formControl.reset()"
        ></i>
      }
    </span>
  }
</div>
