<div class="v-switch d-flex align-items-center">
  <v-form-field
    class="w-100"
    [label]="label"
    [tooltip]="tooltip"
    [required]="isRequired()"
    [testId]="testId"
    [display]="formDisplay"
  >
    <p-toggle-switch
      [formControl]="formControl"
      [required]="isRequired()"
      [title]="label"
      [readonly]="readonly"
      [inputId]="id"
    /><v-validation-message [ngControl]="ngControl"></v-validation-message>
  </v-form-field>
</div>
