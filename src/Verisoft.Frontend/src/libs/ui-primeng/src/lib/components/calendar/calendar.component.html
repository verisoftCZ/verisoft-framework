<div class="v-calendar w-100" vDateInputFilter>
  @if (label && !floatLabel) {
    <v-form-field
      class="w-100"
      [label]="label"
      [tooltip]="tooltip"
      [required]="isRequired()"
      [display]="formDisplay"
    >
      <p-date-picker
        appendTo="body"
        [style]="{ width: '100%' }"
        [inputStyle]="{ width: '100%' }"
        [formControl]="formControl"
        [showClear]="clearable"
        [dataType]="'string'"
        [selectionMode]="selectionMode"
        [icon]="icon"
        [maxDate]="maxDate"
        [id]="inputId"
        [showButtonBar]="true"
        [placeholder]="placeholder"
        [required]="isRequired()"
        [minDate]="minDate"
        [showIcon]="formControl && !formControl.value"
        iconDisplay="input"
        [dateFormat]="dateFormat"
      />
    </v-form-field>
    <v-validation-message [ngControl]="ngControl"></v-validation-message>
  }
  @if (floatLabel) {
    <p-floatLabel>
      <p-date-picker
        appendTo="body"
        [style]="{ width: '100%' }"
        [inputStyle]="{ width: '100%' }"
        [formControl]="formControl"
        [showClear]="clearable"
        [maxDate]="maxDate"
        [id]="inputId"
        [icon]="icon"
        [selectionMode]="selectionMode"
        [showButtonBar]="true"
        [placeholder]="placeholder"
        [required]="isRequired()"
        [minDate]="minDate"
        iconDisplay="input"
      />
      <label [for]="inputId" [innerHTML]="floatLabel"></label>
    </p-floatLabel>
  }
</div>
