<div class="v-textarea">
  @if (!floatLabel) {
    <v-form-field
      [label]="label"
      [tooltip]="tooltip"
      [required]="isRequired()"
      [display]="formDisplay"
      >
      <textarea
        class="flex-grow-1"
        pTextarea
        [rows]="rows"
        [cols]="cols"
        [formControl]="formControl"
        [placeholder]="placeholder"
        [required]="isRequired()"
        [readOnly]="readonly"
        [autoResize]="autoResize"
      ></textarea>
    </v-form-field>
    <v-validation-message [ngControl]="ngControl"></v-validation-message>
  }
  @if (floatLabel) {
    <p-floatLabel>
      <textarea
        class="flex-grow-1"
        pTextarea
        [rows]="rows"
        [cols]="cols"
        [id]="inputId"
        [formControl]="formControl"
        [placeholder]="placeholder"
        [required]="isRequired()"
        [readOnly]="readonly"
        [autoResize]="autoResize"
      ></textarea>
      <label [for]="inputId">{{ floatLabel }}</label>
    </p-floatLabel>
  }
</div>
