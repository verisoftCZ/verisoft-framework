<div class="v-number-input">
  <v-form-field
    class="w-100"
    [label]="label"
    [tooltip]="tooltip"
    [required]="isRequired()"
    [testId]="testId"
  >
    <p-inputNumber
      class="w-100"
      [formControl]="formControl"
      [showButtons]="true"
      [inputId]="inputId"
      [mode]="decimals > 0 ? 'decimal' : currency ? 'currency' : undefined"
      [min]="min"
      [max]="max"
      [minFractionDigits]="decimals"
      [step]="computeStep()"
      [currency]="currency"
      [locale]="locale"
      [showClear]="clearable && formControl.enabled"
    />
    <v-validation-message [ngControl]="ngControl"></v-validation-message>
  </v-form-field>
</div>
