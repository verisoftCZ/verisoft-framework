<div class="v-header d-flex w-100 h-100" [ngStyle]="{ position: fixed ? 'relative' : 'fixed' }">
  <div class="burger-menu d-md-none">
    <v-button [icon]="menuVisible ? icons.cross : icons.action" (click)="toggleMenu()" />
  </div>
  <div class="logo p-3" [routerLink]="[logoRouterLink]">
    <img [src]="logoUrl" class="h-100" />
  </div>
  <div class="flex-grow-1 d-flex flex-column justify-content-center">
    <div class="v-header-title text-nowrap d-none d-md-block">
      {{ title }}
    </div>
    <div class="v-header-module-info">
      <ng-content select="[v-header-module]"></ng-content>
    </div>
  </div>
  <div class="d-flex align-items-center">
    <v-user-info
      [userName]="userName"
      [userRole]="userRole"
      [userAvatar]="userAvatar"
      ></v-user-info>
  </div>
  <div class="d-flex gap-4 align-items-center">
    <ng-content select="[v-header-actions]"></ng-content>
  </div>
  <div class="d-flex gap-4 align-items-center justify-content-center">
    <ng-content select="[v-header-info]"></ng-content>
  </div>
</div>
