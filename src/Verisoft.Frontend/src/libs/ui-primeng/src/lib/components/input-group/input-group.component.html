<div class="v-input-group w-100">
  <v-form-field
    [label]="label"
    [required]="required"
    [tooltip]="tooltip"  >
    <p-inputGroup>
      @for (item of items; track item) {
        @if (item.position === 'left') {
          <p-inputGroupAddon>
            @if (item.icon) {
              <i [class]="item.icon"></i>
            }
            @if (item.text) {
              {{ item.text }}
            }
          </p-inputGroupAddon>
        }
      }
      <input pInputText [formControl]="formControl" class="w-100" />
      @for (item of items; track item) {
        @if (item.position === 'right') {
          <p-inputGroupAddon>
            @if (item.icon) {
              <i [class]="item.icon"></i>
            }
            @if (item.text) {
              {{ item.text }}
            }
          </p-inputGroupAddon>
        }
      }
    </p-inputGroup>
  </v-form-field>
</div>
