<div class="v-breadcrumb card flex justify-content-center">
  @if (useHomeRoute) {
    <p-breadcrumb
      class="max-w-full"
      [model]="items | menuItem"
      [home]="home"
    ></p-breadcrumb>
  } @else {
    <p-breadcrumb class="max-w-full" [model]="items | menuItem"></p-breadcrumb>
  }
</div>
